<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>준 블로그 편집기</title>
    <script>
      if (window.location.hostname === 'jundolee.github.io') {
        const cmsUrl = new URL('https://heroic-axolotl-5c89e6.netlify.app/admin/')
        cmsUrl.search = window.location.search
        cmsUrl.hash = window.location.hash
        window.location.replace(cmsUrl.href)
      }
    </script>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/'
            })
          }
        })
      }
    </script>
  </body>
</html>
